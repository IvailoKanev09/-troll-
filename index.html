<!doctype html>
<html lang="bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Успех на НВО</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>НВО <small>„Учи се, ама друг път“</small></h1>
      <div class="rage" title="Нерв-метър"><div id="rageBar"></div></div>
    </header>

    <main>
      <section id="prof">
        <div class="avatar" id="avatar" aria-hidden="true">🧐</div>
        <p id="bubble" aria-live="polite"></p>
      </section>

      <section id="card" class="panel">
        <div class="top">
          <span id="counter"></span><span id="timer"></span>
        </div>
        <h2 id="question"></h2>
        <div id="answers"></div>
        <div id="free" hidden>
          <input
            id="freeInput"
            autocomplete="off"
            spellcheck="false"
            placeholder="Напиши отговора си…"
          />
          <button id="freeBtn">Провери</button>
        </div>
      </section>

      <section id="captcha" class="panel" hidden>
        <h2>Докажи, че не си робот</h2>
        <p id="capQ"></p>
        <div id="capBox"></div>
      </section>

      <section id="result" class="panel" hidden>
        <h2>Резултат: <span id="score"></span></h2>
        <p id="verdict"></p>
        <button id="again">Опитай пак (ама защо?)</button>
      </section>
    </main>

    <footer>
      <button id="mute">🔇 Спри звука</button>
      <span>Пародия за смях. Не се ядосвай — учи се 😉</span>
    </footer>
    <div id="musicBox" class="musicbox" hidden>
      <div class="mp">
        <div class="mp-disc" aria-hidden="true">💿</div>
        <div class="mp-info" aria-hidden="true">
          <div class="mp-title">♪ ЧАЛГА · NEW HIT</div>
          <div class="mp-eq"><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <div class="mp-bar"><b id="mpFill"></b></div>
        </div>
      </div>
      <p id="mbNote">🎵 Чалга! Натисни ме, за да спра</p>
      <button id="mbHit" class="mbhit" aria-label="Натисни плейъра, за да спре музиката"></button>
    </div>
    <audio id="chalga" src="chalga.mp3" preload="auto" loop></audio>
    <script src="db.js"></script>
    <script src="script.js"></script>
  </body>
</html>
